# Отправка кода на Amvera руками GitHub.
#
# Зачем через GitHub, а не напрямую. Имя git.amvera.ru режется в сети
# владелицы проекта: TCP-соединение проходит, а шифрование обрывается на
# нулевом байте, при этом тот же сервер под именем amvera.ru отвечает
# нормально. Проверено 10.09.2026. У серверов GitHub такого ограничения нет,
# поэтому отправляем оттуда.
#
# Цепочка целиком: правка в коде -> bash scripts/deploy.sh отправляет в
# udobnost-site -> этот файл отправляет дальше на Amvera -> Amvera собирает
# и обновляет сайт. Нажимать в кабинете ничего не нужно.
#
# Вход на Amvera - по ключу SSH. Закрытая часть ключа лежит в секретах
# репозитория под именем AMVERA_SSH_KEY, открытая - в личном кабинете Amvera.
# GitHub хранит секрет зашифрованным, в код он не попадает и в выводе команд
# заменяется звёздочками.

name: Отправить на Amvera

on:
  # Только при изменении основной ветки.
  push:
    branches: [main]
  # И по кнопке, если понадобится отправить то же самое ещё раз.
  workflow_dispatch:

jobs:
  otpravit:
    runs-on: ubuntu-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4
        with:
          # Вся история, а не последний коммит: Amvera принимает обычный
          # push, которому нужна связная цепочка коммитов.
          fetch-depth: 0

      - name: Отправить в репозиторий Amvera
        env:
          AMVERA_SSH_KEY: ${{ secrets.AMVERA_SSH_KEY }}
        run: |
          set -e

          if [ -z "$AMVERA_SSH_KEY" ]; then
            echo "Нет секрета AMVERA_SSH_KEY."
            echo "Настройки репозитория -> Secrets and variables -> Actions."
            exit 1
          fi

          # Почему ключ, а не пароль. До 11.09.2026 отправка шла по паролю от
          # аккаунта Amvera. С 14.09 Amvera отвечала «Authentication failed»,
          # хотя тем же паролем владелица входила в кабинет, - и на старом
          # адресе git.amvera.ru, и на новом git.msk0.amvera.ru. Совпало со
          # сбоем региона Moscow-0, но и после его починки 16.09 пароль не
          # приняли. Ключ не зависит от пароля и не меняется при его смене.
          mkdir -p ~/.ssh
          printf '%s\n' "$AMVERA_SSH_KEY" > ~/.ssh/amvera
          chmod 600 ~/.ssh/amvera

          # Адрес - из кабинета: проект, раздел «Репозиторий», строка
          # «Использовать как основной репозиторий по SSH».
          #
          # accept-new: машина GitHub каждый раз новая и сервер Amvera видит
          # впервые, поэтому его отпечаток принимается без вопроса. Риск
          # подмены сервера здесь невелик: уходит код публичного
          # репозитория, а закрытый ключ при входе по SSH не передаётся.
          git -c core.sshCommand="ssh -i ~/.ssh/amvera -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
              push --force "git@git.msk0.amvera.ru:ula-star/my-work-code" HEAD:master

          echo "Отправлено. Amvera собирает ветку master и запускает сборку сама."
