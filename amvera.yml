# Конфигурация деплоя на Amvera Cloud.
#
# Окружение browser: проект собирается в набор готовых файлов, которые
# раздаёт nginx. Сервер Node в работе не участвует - тест целиком
# статический, ему нечего вычислять на сервере.
#
# additionalCommands - команда сборки, берётся из package.json.
# artifacts          - что раздавать: содержимое папки out, которую
#                      создаёт next build при output: "export".

meta:
  environment: node
  toolchain:
    name: browser
    version: 22

build:
  additionalCommands: npm run build
  artifacts:
    "out/*": /
