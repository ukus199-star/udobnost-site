# Конфигурация деплоя на Amvera Cloud.
#
# environment: node    - окружение Node.js
# toolchain            - чем ставятся зависимости и какой версией Node собирать.
#                        Указан npm, потому что Amvera работает с ним; локально
#                        у нас pnpm, версии Next и React в package.json записаны
#                        точно и не поедут.
# version: 22          - Next.js 16 не запускается на Node 18 из примеров
#                        документации.
# containerPort: 3000  - порт, который слушает next start.
#
# Сборка и запуск берутся из package.json: build и start.

meta:
  environment: node
  toolchain:
    name: npm
    version: 22
  run:
    containerPort: 3000
