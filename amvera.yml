# Конфигурация деплоя на Amvera Cloud.
#
# Серверный режим. До фазы 6 здесь было окружение browser: сайт собирался в
# готовые файлы и раздавался nginx. Статике негде хранить статистику
# прохождений - нет сервера, который примет событие и запишет его в базу.
#
# environment: node       - работает сервер Node, а не только раздача файлов.
# toolchain                - чем ставить зависимости и какая версия Node.
# build.additionalCommands - что выполнить после установки зависимостей.
#                            Amvera сама делает npm install, а сборку - эта строка.
# run.command              - чем запускать. Взято вместо scriptName: тот умеет
#                            только `node файл.js`, а у Next.js точки входа в
#                            виде одного файла нет. command выполняет скрипт
#                            start из package.json - штатный способ Next.js.
# run.containerPort        - порт, который слушает приложение. next start
#                            по умолчанию слушает 3000.
#
# Строка подключения к базе сюда не пишется: она живёт в переменных окружения
# кабинета Amvera под именем DATABASE_URL - правило репо номер 8.

meta:
  environment: node
  toolchain:
    name: npm
    version: 22

build:
  additionalCommands: npm run build

run:
  command: npm run start
  containerPort: 3000
  persistenceMount: /data
